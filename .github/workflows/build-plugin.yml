name: Build Supernote plugin

on:
  workflow_dispatch:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Validate and package
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configure Microsoft npm proxy
        shell: pwsh
        run: |
          npm config set registry https://packagefeedproxy.microsoft.io/npm/
          if ((npm config get registry).Trim() -ne "https://packagefeedproxy.microsoft.io/npm/") {
            throw "npm registry was not configured to use the Microsoft proxy"
          }

      - name: Restore dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --no-cache

      - name: Test
        run: npm test -- --runInBand

      - name: Build plugin package
        shell: pwsh
        run: |
          & .\buildPlugin.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Plugin packaging failed"
          }

      - name: Verify TypeScript-only plugin package
        shell: pwsh
        run: |
          $plugin = "build\outputs\SupernoteToday.snplg"
          $generatedConfig = "build\generated\PluginConfig.json"
          if (-not (Test-Path $plugin)) {
            throw "Expected plugin package was not produced: $plugin"
          }
          $config = Get-Content $generatedConfig -Raw | ConvertFrom-Json
          if ($config.PSObject.Properties.Name -contains "nativeCodePackage") {
            throw "TypeScript-only package unexpectedly declares nativeCodePackage"
          }
          if ($config.PSObject.Properties.Name -contains "reactPackages") {
            throw "TypeScript-only package unexpectedly declares reactPackages"
          }
          if (Test-Path "build\generated\app.npk") {
            throw "TypeScript-only package unexpectedly contains app.npk"
          }

          $verification = Join-Path $env:RUNNER_TEMP "supernote-today-package"
          New-Item -ItemType Directory -Path $verification | Out-Null
          $zip = Join-Path $verification "SupernoteToday.zip"
          Copy-Item $plugin $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $verification "contents")
          foreach ($entry in @("PluginConfig.json", "SupernoteToday.bundle", "icon.png")) {
            if (-not (Test-Path (Join-Path $verification "contents\$entry"))) {
              throw "Packaged plugin is missing $entry"
            }
          }
          if (Test-Path (Join-Path $verification "contents\app.npk")) {
            throw "Packaged plugin unexpectedly contains app.npk"
          }

          (Get-FileHash $plugin -Algorithm SHA256).Hash |
            Set-Content "build\outputs\SupernoteToday.snplg.sha256"

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: supernote-today-snplg
          path: |
            build/outputs/SupernoteToday.snplg
            build/outputs/SupernoteToday.snplg.sha256
          if-no-files-found: error
          retention-days: 30
